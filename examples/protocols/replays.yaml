# Replays the replay agent wrote for the protocols demo after reading the
# handlers. They state what the code should do, so the ones that describe a
# planted bug fail until it is fixed.
#
#   go run ./examples/protocols/cmd/protocols-demo &
#   replayharness replay examples/protocols/replays.yaml --target http://127.0.0.1:8081 --grpc 127.0.0.1:9091
replays:
  # gRPC
  - name: an order can be read back
    steps:
      - grpc: orders.v1.Orders/CreateOrder
        message: {customer: bob, items: [{sku: MUG-3, qty: 1, price_cents: 900}]}
        expect: {code: OK, json: {$.customer: bob, $.status: OPEN}}
        save: {id: $.id}
      - grpc: orders.v1.Orders/GetOrder
        message: {id: "{{id}}"}
        expect: {code: OK, json: {$.id: "{{id}}", $.total_cents: "900"}}

  - name: an order's total comes from its items
    why: createOrder lets total_cents from the request replace the computed total (grpc.go:172)
    steps:
      - grpc: orders.v1.Orders/CreateOrder
        message: {customer: eve, items: [{sku: BOOK-1, qty: 2, price_cents: 1500}], total_cents: 1}
        expect: {code: OK, json: {$.total_cents: "3000"}}   # int64 comes back as a string

  - name: an order without a customer is rejected
    why: customer is REQUIRED in orders.proto, but createOrder never checks it (grpc.go:160)
    steps:
      - grpc: orders.v1.Orders/CreateOrder
        message: {items: [{sku: PEN-9, qty: 1, price_cents: 250}]}
        expect: {code: INVALID_ARGUMENT}

  - name: an unknown order is NOT_FOUND
    why: getOrder returns a plain error for a missing order, which gRPC sends as UNKNOWN (grpc.go:198)
    steps:
      - grpc: orders.v1.Orders/GetOrder
        message: {id: 999999}
        expect: {code: NOT_FOUND}

  - name: a negative page size is rejected
    why: listOrders slices matched[:size] without checking size (grpc.go:220)
    steps:
      - grpc: orders.v1.Orders/ListOrders
        message: {page_size: -1}
        expect: {code: INVALID_ARGUMENT}

  - name: a cancelled order cannot be cancelled again
    why: cancelOrder sets the status without checking it (grpc.go:236)
    steps:
      - grpc: orders.v1.Orders/CreateOrder
        message: {customer: dan, items: [{sku: INK-2, qty: 1, price_cents: 400}]}
        save: {id: $.id}
      - grpc: orders.v1.Orders/CancelOrder
        message: {id: "{{id}}"}
        expect: {code: OK, json: {$.status: CANCELLED}}
      - grpc: orders.v1.Orders/CancelOrder
        message: {id: "{{id}}"}
        expect: {code: FAILED_PRECONDITION}

  - name: watching a customer streams only their orders
    steps:
      - grpc: orders.v1.Orders/WatchOrders
        message: {customer: ada}
        expect: {code: OK, json: {"$[0].customer": ada, $.length: 1}}

  # GraphQL
  - name: a product can be fetched
    steps:
      - graphql: "query ($id: Int!) { product(id: $id) { id name priceCents } }"
        variables: {id: 1}
        expect: {status: 200, json: {$.data.product.name: Notebook}}

  - name: product 0 is null, not a crash
    why: product indexes c.products[id-1] without checking id >= 1 (graphql.go:187)
    steps:
      - graphql: "{ product(id: 0) { id name } }"
        expect: {json: {$.data.product: "<null>"}}

  - name: a negative limit is rejected
    why: products slices out[:limit] without checking limit (graphql.go:201)
    steps:
      - graphql: "{ products(limit: -1) { id } }"
        expect: {json: {"$.errors[0].message": "<string>"}}

  - name: a rating above 5 is rejected
    why: addReview stores any rating, though the schema says 1 to 5 (graphql.go:209)
    steps:
      - graphql: "mutation { addReview(productId: 1, rating: 9, text: \"spam\") { id rating } }"
        expect: {json: {$.errors: "<nonempty>"}}

  - name: deleting a product needs the admin token
    why: deleteProduct never reads the Authorization header (graphql.go:216)
    steps:
      - graphql: "mutation { deleteProduct(id: 3) }"
        no_auth: true
        expect: {json: {$.errors: "<nonempty>"}}

  - name: a mutation sent with GET does not run
    why: the handler executes mutations from GET query strings (graphql.go:53)
    steps:
      - method: GET
        graphql: "mutation { addReview(productId: 2, rating: 5, text: \"via GET\") { id } }"
        expect: {status: [400, 405]}

  # WebSocket
  - name: joining a room answers joined
    steps:
      - websocket: /ws/chat
        send: [{type: join, room: "solo-{{unique}}", name: ada}]
        receive: 1
        expect: {status: 101, json: {"$[0].type": joined, "$[0].members": 1}}

  - name: say before join is an error message
    steps:
      - websocket: /ws/chat
        send: [{type: say, text: hello}]
        receive: 1
        expect: {json: {"$[0].type": error}}

  - name: the member count drops when a client leaves
    why: the chat never removes a member whose connection ended (ws.go:32)
    steps:
      - websocket: /ws/chat
        send: [{type: join, room: "lobby-{{unique}}", name: ada}]
        receive: 1
        expect: {json: {"$[0].members": 1}}
      - websocket: /ws/chat
        send: [{type: join, room: "lobby-{{unique}}", name: bob}]
        receive: 1
        expect: {json: {"$[0].members": 1}}

  - name: a message that is not JSON gets an error, not a dropped connection
    why: the decode error is ignored and msg["type"].(string) panics on a nil map (ws.go:40)
    steps:
      - websocket: /ws/chat
        send: ["hello"]
        receive: 1
        expect: {json: {"$[0].type": error}}
