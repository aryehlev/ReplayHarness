syntax = "proto3";

package orders.v1;

import "google/api/field_behavior.proto";

// Orders is the demo gRPC service. Its handlers are in grpc.go.
service Orders {
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc CancelOrder(CancelOrderRequest) returns (Order);
  rpc WatchOrders(WatchOrdersRequest) returns (stream Order);
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  OPEN = 1;
  CANCELLED = 2;
}

message Item {
  string sku = 1;
  int32 qty = 2;
  int64 price_cents = 3;
}

message Order {
  int64 id = 1;
  string customer = 2;
  repeated Item items = 3;
  int64 total_cents = 4;
  Status status = 5;
}

message CreateOrderRequest {
  string customer = 1 [(google.api.field_behavior) = REQUIRED];
  repeated Item items = 2 [(google.api.field_behavior) = REQUIRED];
  // Ignored by a correct server: the total comes from the items.
  int64 total_cents = 3;
}

message GetOrderRequest {
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListOrdersRequest {
  int32 page_size = 1;
  string customer = 2;
}

message ListOrdersResponse {
  repeated Order orders = 1;
}

message CancelOrderRequest {
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message WatchOrdersRequest {
  string customer = 1;
}
