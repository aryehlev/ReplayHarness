name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go: ["1.24", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Demo run against the buggy example API
        run: |
          go build -o replayharness ./cmd/replayharness
          go run ./examples/buggyapi/cmd/buggy-api -q &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health >/dev/null && break; sleep 1; done
          ./replayharness run ./examples/buggyapi --target http://127.0.0.1:8080 --no-color --junit report.xml --fail-on never
          ./replayharness run ./examples/buggyapi/api.yaml --target http://127.0.0.1:8080 --no-color --fail-on never
          # The demo replays describe the planted bugs, so 7 of them are expected to fail.
          ./replayharness replay ./examples/buggyapi/replays.yaml --target http://127.0.0.1:8080 --no-color --junit replays.xml --fail-on never
